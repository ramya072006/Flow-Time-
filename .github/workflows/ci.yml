name: CI / CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  vulnerability-test:
    name: Vulnerability Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Vulnerability Audit & Security Test
        run: node scripts/vulnerability-test.js

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Packages
        run: npm run build

      - name: Run Unit Tests
        run: npm run test

      - name: Generate Excel Test Execution Status Report
        run: npm run test:report

      - name: Upload Excel Status Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: excel-test-execution-status-report
          path: |
            Test_Execution_Status_Report.xlsx
            Test_Execution_Status_Report.csv

  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run API Load & Throughput Test
        run: node scripts/load-test.js

  selenium-testing:
    name: Selenium Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Selenium E2E Suite
        run: node scripts/selenium-test.js

  appium-testing:
    name: Appium Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Appium Mobile UI Suite
        run: node scripts/appium-test.js
