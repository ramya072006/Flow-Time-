## FlowTime Helm Chart Values

replicaCount: 2

image:
  server:
    repository: flowtime/server
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  client:
    repository: flowtime/client
    tag: "1.0.0"
    pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

## Server configuration
server:
  replicaCount: 2
  port: 5000
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  env:
    NODE_ENV: production
    PORT: "5000"
    JWT_ACCESS_SECRET: ""   # Set via secret
    JWT_REFRESH_SECRET: ""  # Set via secret
    MONGODB_URI: ""         # Set via secret
    REDIS_URL: ""           # Set via secret
    GEMINI_API_KEY: ""      # Set via secret
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_USER: ""
    SMTP_PASS: ""           # Set via secret

## Client configuration
client:
  replicaCount: 2
  port: 80
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  env:
    VITE_API_URL: "https://api.flowtime.app/api"
    VITE_SOCKET_URL: "https://api.flowtime.app"

## Services
service:
  server:
    type: ClusterIP
    port: 5000
  client:
    type: ClusterIP
    port: 80

## Ingress
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: flowtime.app
      paths:
        - path: /
          pathType: Prefix
          service: client
    - host: api.flowtime.app
      paths:
        - path: /
          pathType: Prefix
          service: server
  tls:
    - secretName: flowtime-tls
      hosts:
        - flowtime.app
        - api.flowtime.app

## Health checks
livenessProbe:
  server:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
  client:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 10
    periodSeconds: 10

readinessProbe:
  server:
    httpGet:
      path: /health
      port: 5000
    initialDelaySeconds: 15
    periodSeconds: 5
  client:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5

## Persistence
persistence:
  enabled: true
  storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi

## MongoDB (bitnami chart)
mongodb:
  enabled: true
  auth:
    enabled: true
    rootPassword: ""  # Set via secret
    username: flowtime
    password: ""      # Set via secret
    database: flowtime
  persistence:
    enabled: true
    size: 20Gi
  replicaCount: 3

## Redis (bitnami chart)
redis:
  enabled: true
  auth:
    enabled: true
    password: ""  # Set via secret
  master:
    persistence:
      enabled: true
      size: 5Gi
  replica:
    replicaCount: 2

## Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

## Network Policy
networkPolicy:
  enabled: true

## RBAC
rbac:
  create: true

## Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    namespace: monitoring
